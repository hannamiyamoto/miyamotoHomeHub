<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Command Center</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
  <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], display: ['Outfit', 'sans-serif'] }, colors: { warm: { bg: '#FBF9F5', card: '#FFFFFF', subtle: '#F4F0E8', border: '#E5DFD5', text: '#2C2A29', muted: '#78736D' } } } }
    }
  </script>

  <style>
    body { background-color: #FBF9F5; color: #2C2A29; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .warm-card { background: #FFFFFF; border: 1px solid #E5DFD5; box-shadow: 0 4px 20px -2px rgba(44, 42, 41, 0.04); }
    .drag-over-active { background-color: #FEF3C7 !important; border-color: #F59E0B !important; border-style: dashed !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D8D1C7; border-radius: 9999px; }
    .draggable-item { cursor: grab; } .draggable-item:active { cursor: grabbing; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans antialiased">

  <header class="h-20 px-8 flex items-center justify-between shrink-0 bg-white border-b border-warm-border z-10 shadow-xs">
    <div class="flex items-center gap-6">
      <div class="flex flex-col">
        <div id="live-time" class="text-3xl font-display font-bold tracking-tight text-warm-text leading-none">--:--</div>
        <div id="live-date" class="text-xs font-semibold text-warm-muted mt-1 uppercase tracking-wider">Loading...</div>
      </div>
      <div class="h-8 w-[1px] bg-warm-border"></div>
      <div class="flex items-center gap-3">
        <i id="weather-icon" data-lucide="sun" class="w-8 h-8 text-amber-500"></i>
        <div class="flex flex-col">
          <div id="weather-temp" class="text-lg font-bold text-warm-text leading-tight">--°F</div>
          <div class="text-[10px] font-semibold text-warm-muted uppercase tracking-wider">Orange County</div>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <button onclick="handleGoogleAuth()" id="google-sync-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-50 border border-blue-200 text-blue-800 text-xs font-semibold transition-all hover:bg-blue-100">
        <span id="google-dot" class="w-2 h-2 rounded-full bg-blue-400"></span><i data-lucide="calendar" class="w-3.5 h-3.5 text-blue-600"></i><span id="google-sync-text">Connect GCalendar</span>
      </button>
      <button onclick="switchTab('dashboard')" id="nav-btn-dashboard" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all bg-emerald-600 text-white shadow-md flex items-center gap-2"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard</button>
      <button onclick="switchTab('grocery')" id="nav-btn-grocery" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all bg-white border border-warm-border text-warm-text hover:bg-warm-subtle flex items-center gap-2"><i data-lucide="shopping-bag" class="w-4 h-4 text-amber-600"></i> Groceries</button>
      <button onclick="switchTab('recipes')" id="nav-btn-recipes" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all bg-white border border-warm-border text-warm-text hover:bg-warm-subtle flex items-center gap-2"><i data-lucide="chef-hat" class="w-4 h-4 text-rose-500"></i> Vault</button>
      <button onclick="openSettingsModal()" class="p-2.5 rounded-xl bg-warm-subtle border border-warm-border text-warm-text hover:bg-warm-border transition-all"><i data-lucide="settings" class="w-4 h-4"></i></button>
    </div>
  </header>

  <main class="flex-1 p-6 overflow-hidden relative">
    
    <div id="tab-dashboard" class="h-full flex gap-6">
      <section class="w-1/2 flex flex-col gap-6 overflow-hidden h-full">
        <!-- Chores -->
        <div class="h-1/2 flex flex-col warm-card rounded-3xl p-5 overflow-hidden">
          <div class="flex flex-col gap-3 pb-3 border-b border-warm-border shrink-0">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="p-2.5 rounded-2xl bg-emerald-100 text-emerald-800 border border-emerald-200"><i data-lucide="check-square" class="w-5 h-5"></i></div>
                <h2 class="font-display font-bold text-base text-warm-text">Household Chores</h2>
              </div>
              <div class="flex gap-2">
                <button onclick="openAddChoreModal()" class="p-2 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-100"><i data-lucide="plus" class="w-4 h-4"></i></button>
                <button onclick="resetChores()" class="px-3 py-1.5 rounded-xl bg-warm-subtle text-warm-muted hover:text-emerald-700 text-[10px] font-bold border flex items-center gap-1.5"><i data-lucide="rotate-ccw" class="w-3 h-3"></i> Reset</button>
              </div>
            </div>
            <div class="flex items-center justify-between pt-1">
              <div class="flex bg-warm-subtle p-1 rounded-xl">
                <button onclick="setChoreFrequency('daily')" id="freq-btn-daily" class="bg-white shadow-sm text-warm-text px-3 py-1 rounded-lg text-xs font-bold transition-all">Daily</button>
                <button onclick="setChoreFrequency('weekly')" id="freq-btn-weekly" class="text-warm-muted hover:text-warm-text px-3 py-1 rounded-lg text-xs font-bold transition-all">Weekly</button>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="setChoreFilter('ALL')" id="filter-btn-ALL" class="px-3 py-1 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow-xs">All</button>
                <button onclick="setChoreFilter('Me')" id="filter-btn-Me" class="px-3 py-1 rounded-xl text-xs font-bold border border-warm-border bg-white text-warm-muted">Me</button>
                <button onclick="setChoreFilter('Ryan')" id="filter-btn-Ryan" class="px-3 py-1 rounded-xl text-xs font-bold border border-warm-border bg-white text-warm-muted">Ryan</button>
              </div>
            </div>
          </div>
          <div class="flex-1 overflow-y-auto my-2 space-y-2 pr-2" id="chores-main-container"></div>
        </div>

        <!-- Tasks -->
        <div class="h-1/2 flex flex-col warm-card rounded-3xl p-5 overflow-hidden">
          <div class="flex items-center justify-between pb-3 border-b border-warm-border shrink-0">
            <div class="flex items-center gap-2.5">
              <div class="p-2.5 rounded-2xl bg-purple-50 text-purple-700 border border-purple-200"><i data-lucide="list-todo" class="w-5 h-5"></i></div>
              <h2 class="font-display font-bold text-base text-warm-text">One-Off Tasks</h2>
            </div>
            <div class="flex gap-2">
                <button onclick="openAddTaskModal()" class="px-3 py-1.5 rounded-xl bg-purple-50 text-purple-700 hover:bg-purple-100 text-xs font-bold border border-purple-200 flex items-center gap-1.5"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add</button>
                <button onclick="syncTasksToTrello()" id="trello-tasks-sync-btn" class="px-3 py-1.5 rounded-xl bg-blue-600 text-white hover:bg-blue-700 text-xs font-bold flex items-center gap-1.5"><i data-lucide="trello" class="w-3.5 h-3.5"></i> Sync</button>
            </div>
          </div>
          <div class="flex-1 overflow-y-auto my-2 space-y-2 pr-1" id="tasks-main-container"></div>
        </div>
      </section>

      <section class="w-1/2 flex flex-col gap-6 overflow-hidden h-full">
        <!-- Schedule -->
        <div class="h-1/2 flex flex-col warm-card rounded-3xl p-5 overflow-hidden">
          <div class="flex items-center justify-between pb-3 border-b border-warm-border shrink-0">
            <div class="flex items-center gap-2.5">
              <div class="p-2.5 rounded-2xl bg-blue-50 text-blue-600 border border-blue-200"><i data-lucide="calendar" class="w-5 h-5"></i></div>
              <h3 class="font-display font-bold text-base text-warm-text">Today's Schedule</h3>
            </div>
            <button onclick="openCalendarModal()" class="px-3 py-1.5 rounded-xl bg-blue-50 text-blue-700 hover:bg-blue-100 text-xs font-bold border border-blue-200">Month View</button>
          </div>
          <div class="flex-1 overflow-y-auto my-2 space-y-2 pr-1" id="today-events-container"></div>
        </div>

        <!-- Meals -->
        <div class="h-1/2 flex flex-col warm-card rounded-3xl p-5 overflow-hidden">
          <div class="flex items-center justify-between pb-3 border-b border-warm-border shrink-0">
            <div class="flex items-center gap-2.5">
              <div class="p-2.5 rounded-2xl bg-amber-50 text-amber-700 border border-amber-200"><i data-lucide="utensils" class="w-5 h-5"></i></div>
              <h3 class="font-display font-bold text-base text-warm-text">Today's Meals</h3>
            </div>
            <button onclick="openMealPlannerModal()" class="px-3 py-1.5 rounded-xl bg-amber-50 text-amber-800 hover:bg-amber-100 text-xs font-bold border border-amber-200">Plan Week</button>
          </div>
          <div class="flex-1 flex flex-col justify-center my-2 gap-2" id="today-meal-slots"></div>
        </div>
      </section>
    </div>

    <!-- GROCERIES TAB -->
    <div id="tab-grocery" class="h-full hidden flex-col warm-card rounded-3xl p-6 overflow-hidden">
      <div class="flex items-center justify-between pb-5 border-b border-warm-border shrink-0">
        <div>
          <h2 class="font-display font-bold text-xl text-warm-text">Smart Grocery List</h2>
        </div>
        <div class="flex gap-4">
           <div class="flex gap-2">
             <input type="text" id="manual-grocery-input" placeholder="Add custom item..." class="px-3 py-2 border border-warm-border rounded-xl text-xs bg-warm-subtle w-48">
             <button onclick="addManualGrocery()" class="px-3 py-2 bg-amber-600 text-white rounded-xl text-xs font-bold">Add</button>
           </div>
           <button onclick="syncGroceriesToTrello()" id="trello-grocery-sync-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center gap-2"><i data-lucide="trello" class="w-4 h-4"></i> Push to Trello</button>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto py-4 flex gap-6">
        <div class="w-2/3 grid grid-cols-2 gap-4 h-max" id="grocery-categories-container"></div>
        <div class="w-1/3 bg-warm-subtle border border-warm-border rounded-2xl p-4 h-max">
          <h3 class="font-bold text-sm text-warm-text mb-1 flex items-center gap-2"><i data-lucide="box" class="w-4 h-4 text-emerald-600"></i> Pantry Staples</h3>
          <div id="pantry-staples-container" class="space-y-2"></div>
        </div>
      </div>
    </div>

    <!-- RECIPE VAULT TAB -->
    <div id="tab-recipes" class="h-full hidden flex-col warm-card rounded-3xl p-6 overflow-hidden">
      <div class="flex items-center justify-between pb-5 border-b border-warm-border shrink-0">
        <h2 class="font-display font-bold text-xl text-warm-text">Recipe Vault</h2>
        <button onclick="document.getElementById('modal-add-recipe').classList.remove('hidden')" class="px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-xs font-bold flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Add Recipe</button>
      </div>
      <div class="flex-1 overflow-y-auto py-4 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4" id="recipe-vault-grid"></div>
    </div>
  </main>

  <!-- MODALS -->
  <div id="modal-settings" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white border border-warm-border rounded-3xl max-w-md w-full p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display font-bold text-lg text-warm-text flex items-center gap-2"><i data-lucide="settings" class="w-5 h-5 text-warm-muted"></i> Settings</h3>
        <button onclick="closeModals()" class="text-warm-muted hover:text-rose-500"><i data-lucide="x"></i></button>
      </div>
      <div class="space-y-3 max-h-[60vh] overflow-y-auto pr-2">
        <div><label class="block text-[10px] font-bold uppercase text-blue-600 mb-1">Google Client ID</label><input type="text" id="set-g-client" class="w-full bg-warm-subtle border rounded-lg px-3 py-2 text-xs"></div>
        <div><label class="block text-[10px] font-bold uppercase text-blue-600 mb-1">Google API Key</label><input type="password" id="set-g-api" class="w-full bg-warm-subtle border rounded-lg px-3 py-2 text-xs"></div>
        <hr class="my-2 border-warm-border">
        <div><label class="block text-[10px] font-bold uppercase text-blue-600 mb-1">Trello REST API Key</label><input type="password" id="set-t-api" class="w-full bg-warm-subtle border rounded-lg px-3 py-2 text-xs"></div>
        <div><label class="block text-[10px] font-bold uppercase text-blue-600 mb-1">Trello Token</label><input type="password" id="set-t-token" class="w-full bg-warm-subtle border rounded-lg px-3 py-2 text-xs"></div>
        <div><label class="block text-[10px] font-bold uppercase text-blue-600 mb-1">Trello Grocery List ID</label><input type="text" id="set-t-groc-list" class="w-full bg-warm-subtle border rounded-lg px-3 py-2 text-xs"></div>
        <div><label class="block text-[10px] font-bold uppercase text-blue-600 mb-1">Trello Tasks List ID</label><input type="text" id="set-t-task-list" class="w-full bg-warm-subtle border rounded-lg px-3 py-2 text-xs"></div>
        <hr class="my-2 border-warm-border">
        <div><label class="block text-[10px] font-bold uppercase text-purple-600 mb-1">Gemini AI Key (For Recipes)</label><input type="password" id="set-ai-api" class="w-full bg-warm-subtle border rounded-lg px-3 py-2 text-xs"></div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeModals()" class="px-4 py-2 bg-warm-subtle rounded-xl text-xs font-bold text-warm-text">Cancel</button>
        <button onclick="saveSettings()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Save Keys</button>
      </div>
    </div>
  </div>

  <div id="modal-add-recipe" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white border border-warm-border rounded-3xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display font-bold text-lg text-warm-text">Add Recipe</h3>
        <button onclick="closeModals()" class="text-warm-muted hover:text-rose-500"><i data-lucide="x"></i></button>
      </div>
      <div class="mb-4 p-4 bg-purple-50 border border-purple-200 rounded-xl flex flex-col gap-2">
          <label class="text-[10px] font-bold uppercase text-purple-700 flex items-center gap-1"><i data-lucide="sparkles" class="w-3 h-3"></i> AI Auto-Import</label>
          <div class="flex gap-2">
            <input type="text" id="ai-recipe-input" placeholder="Paste recipe text..." class="flex-1 bg-white border border-purple-200 rounded-lg px-3 py-2 text-xs">
            <button onclick="importAiRecipe()" id="ai-btn" class="px-3 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-xs font-bold">Import</button>
          </div>
      </div>
      <div class="space-y-4">
        <div><label class="block text-xs font-bold text-warm-text">Recipe Title</label><input type="text" id="input-recipe-title" class="w-full bg-warm-subtle border rounded-xl px-3 py-2 text-xs"></div>
        <div><label class="block text-xs font-bold text-warm-text">Ingredients (Format: Amount Unit Name)</label><textarea id="input-recipe-ingredients" rows="3" class="w-full bg-warm-subtle border rounded-xl px-3 py-2 text-xs"></textarea></div>
        <div><label class="block text-xs font-bold text-warm-text">Instructions</label><textarea id="input-recipe-instructions" rows="3" class="w-full bg-warm-subtle border rounded-xl px-3 py-2 text-xs"></textarea></div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeModals()" class="px-4 py-2 bg-warm-subtle rounded-xl text-xs font-bold text-warm-text">Cancel</button>
        <button onclick="saveRecipe()" class="px-4 py-2 bg-rose-500 text-white rounded-xl text-xs font-bold">Save Recipe</button>
      </div>
    </div>
  </div>

  <div id="modal-add-chore" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white border border-warm-border rounded-3xl max-w-sm w-full p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display font-bold text-lg text-warm-text">Add Chore</h3>
        <button onclick="closeModals()" class="text-warm-muted"><i data-lucide="x"></i></button>
      </div>
      <div class="space-y-4">
        <div><label class="block text-xs font-bold mb-1">Chore Name</label><input type="text" id="input-chore-title" class="w-full bg-warm-subtle border rounded-xl px-3 py-2 text-xs"></div>
        <div>
          <label class="block text-xs font-bold mb-1">Frequency</label>
          <select id="input-chore-frequency" class="w-full bg-warm-subtle border rounded-xl px-3 py-2 text-xs" onchange="document.getElementById('input-chore-days-container').style.display = this.value === 'weekly' ? 'block' : 'none'">
            <option value="daily">Daily</option><option value="weekly">Weekly</option>
          </select>
        </div>
        <div id="input-chore-days-container" style="display: none;">
          <label class="block text-xs font-bold mb-1">Day</label>
          <select id="input-chore-days" class="w-full bg-warm-subtle border rounded-xl px-3 py-2 text-xs">
            <option value="Monday">Monday</option><option value="Tuesday">Tuesday</option><option value="Wednesday">Wednesday</option><option value="Thursday">Thursday</option><option value="Friday">Friday</option><option value="Saturday">Saturday</option><option value="Sunday">Sunday</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold mb-2">Assignees</label>
          <div class="flex gap-4">
            <label class="flex items-center gap-2 text-xs"><input type="checkbox" id="input-chore-me" value="Me" class="rounded text-emerald-600" checked> Me</label>
            <label class="flex items-center gap-2 text-xs"><input type="checkbox" id="input-chore-ryan" value="Ryan" class="rounded text-emerald-600" checked> Ryan</label>
          </div>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeModals()" class="px-4 py-2 bg-warm-subtle rounded-xl text-xs font-bold">Cancel</button>
        <button onclick="saveChore()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Add Chore</button>
      </div>
    </div>
  </div>

  <div id="modal-add-task" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white border border-warm-border rounded-3xl max-w-sm w-full p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display font-bold text-lg text-warm-text">Add Task</h3>
        <button onclick="closeModals()" class="text-warm-muted"><i data-lucide="x"></i></button>
      </div>
      <div class="space-y-4">
        <div><label class="block text-xs font-bold mb-1">Task Description</label><input type="text" id="input-task-title" class="w-full bg-warm-subtle border rounded-xl px-3 py-2 text-xs"></div>
        <div>
          <label class="block text-xs font-bold mb-2">Assign To</label>
          <select id="input-task-assignee" class="w-full bg-warm-subtle border rounded-xl px-3 py-2 text-xs">
            <option value="Unassigned">Unassigned</option><option value="Me">Me</option><option value="Ryan">Ryan</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeModals()" class="px-4 py-2 bg-warm-subtle rounded-xl text-xs font-bold">Cancel</button>
        <button onclick="saveTask()" class="px-4 py-2 bg-purple-600 text-white rounded-xl text-xs font-bold">Add Task</button>
      </div>
    </div>
  </div>

  <!-- CALENDAR MODAL (MONTH VIEW) -->
  <div id="modal-calendar" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-6 z-40 hidden">
    <div class="bg-white border border-warm-border rounded-3xl max-w-5xl w-full h-[85vh] p-6 flex flex-col shadow-2xl">
      <div class="flex justify-between items-center pb-4 border-b shrink-0">
        <h3 class="font-display font-bold text-xl flex items-center gap-2"><i data-lucide="calendar" class="text-blue-600"></i> Month Calendar</h3>
        <button onclick="closeModals()" class="text-warm-muted hover:text-rose-500"><i data-lucide="x"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto mt-4" id="full-calendar-container"></div>
    </div>
  </div>

  <div id="modal-event-details" class="fixed inset-0 bg-black/20 backdrop-blur-sm flex items-center justify-center p-4 z-[60] hidden">
    <div class="bg-white border border-warm-border rounded-3xl max-w-sm w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display font-bold text-lg text-blue-700 flex items-center gap-2"><i data-lucide="info" class="w-5 h-5"></i> Details</h3>
        <button onclick="closeEventDetails()" class="text-warm-muted hover:text-rose-500"><i data-lucide="x"></i></button>
      </div>
      <div class="space-y-4">
        <div><label class="block text-[10px] font-bold uppercase text-warm-muted">Title</label><div id="detail-title" class="text-sm font-bold text-warm-text break-words"></div></div>
        <div><label class="block text-[10px] font-bold uppercase text-warm-muted">Time</label><div id="detail-time" class="text-sm text-warm-text"></div></div>
        <div><label class="block text-[10px] font-bold uppercase text-warm-muted">Location</label><div id="detail-loc" class="text-sm text-warm-text break-words min-w-0"></div></div>
        <div><label class="block text-[10px] font-bold uppercase text-warm-muted">Guests</label><div id="detail-guests" class="text-sm text-warm-text break-words min-w-0"></div></div>
      </div>
    </div>
  </div>

  <div id="modal-meal-planner" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-6 z-40 hidden">
    <div class="bg-white border border-warm-border rounded-3xl max-w-5xl w-full h-[85vh] p-6 flex flex-col shadow-2xl">
      <div class="flex justify-between items-center pb-4 border-b shrink-0">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-amber-50 rounded-xl text-amber-700"><i data-lucide="utensils" class="w-5 h-5"></i></div>
            <div><h3 class="font-display font-bold text-xl">Meal Planner</h3></div>
        </div>
        <button onclick="closeModals()" class="text-warm-muted hover:text-rose-500"><i data-lucide="x"></i></button>
      </div>
      <div class="flex-1 grid grid-cols-12 gap-4 mt-4 min-h-0">
        <div class="col-span-9 overflow-y-auto pr-2" id="meal-planner-grid"></div>
        <div class="col-span-3 bg-warm-subtle rounded-2xl p-4 overflow-y-auto border border-warm-border" id="meal-planner-vault"></div>
      </div>
    </div>
  </div>

  <div id="modal-cook-mode" class="fixed inset-0 bg-black/50 backdrop-blur-md flex items-center justify-center p-8 z-50 hidden">
    <div class="bg-white rounded-3xl max-w-3xl w-full max-h-full overflow-y-auto p-8 relative shadow-2xl">
      <button onclick="closeModals()" class="absolute top-6 right-6 p-2 bg-warm-subtle rounded-xl text-warm-muted hover:text-rose-500"><i data-lucide="x"></i></button>
      <h2 id="cook-title" class="font-display font-bold text-3xl text-warm-text mb-6">Recipe</h2>
      <div class="grid grid-cols-3 gap-8">
        <div class="col-span-1 border-r border-warm-border pr-4">
          <h4 class="font-bold text-sm text-warm-text mb-3 uppercase tracking-wider text-rose-600">Ingredients</h4>
          <ul id="cook-ingredients" class="space-y-2 text-sm text-warm-text"></ul>
        </div>
        <div class="col-span-2">
          <h4 class="font-bold text-sm text-warm-text mb-3 uppercase tracking-wider text-emerald-600">Instructions</h4>
          <ol id="cook-instructions" class="space-y-4 list-decimal pl-5 text-warm-text text-sm leading-relaxed marker:font-bold marker:text-emerald-500"></ol>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- 1. DATA SANITIZATION (PREVENTS CRASHES FROM OLD DATA) ---
    // Smooth custom alert mapping to comply with UI overlay rules
    window.alert = function(msg) {
        const t = document.createElement('div');
        t.className = 'fixed bottom-4 right-4 bg-rose-600 text-white px-6 py-3 rounded-2xl shadow-2xl z-[100] text-sm font-bold opacity-0 transition-opacity duration-300';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.classList.remove('opacity-0'), 10);
        setTimeout(() => {
            t.classList.add('opacity-0');
            setTimeout(() => t.remove(), 300);
        }, 4000);
    };

    function getArrayData(key) {
        try {
            const data = JSON.parse(localStorage.getItem(key));
            return Array.isArray(data) ? data : [];
        } catch(e) { return []; }
    }

    const GOOGLE_CLIENT_ID = localStorage.getItem('cfg_g_client') || '';
    const GOOGLE_API_KEY = localStorage.getItem('cfg_g_api') || '';
    const TRELLO_API_KEY = localStorage.getItem('cfg_t_api') || '';
    const TRELLO_TOKEN = localStorage.getItem('cfg_t_token') || '';
    const TRELLO_GROCERY_LIST_ID = localStorage.getItem('cfg_t_groc_list') || '';
    const TRELLO_TASKS_LIST_ID = localStorage.getItem('cfg_t_task_list') || '';
    const GEMINI_API_KEY = localStorage.getItem('cfg_ai_api') || '';

    const DAYS_FULL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const SLOTS = ['breakfast', 'lunch', 'dinner'];

    let todayDateObj = new Date();
    let todayFullName = todayDateObj.toLocaleDateString('en-US', { weekday: 'long' });
    if (!DAYS_FULL.includes(todayFullName)) todayFullName = 'Monday';

    // Auto-Heal Corrupted Data
    let recipes = getArrayData('sl_recipes');
    let events = getArrayData('sl_events');
    let manualGroceries = getArrayData('sl_manual_groceries');
    let tasks = getArrayData('sl_tasks').map(t => ({ ...t, assignee: t.assignee || 'Unassigned', done: !!t.done }));
    let chores = getArrayData('sl_chores').map(c => ({ 
        ...c, assignees: Array.isArray(c.assignees) ? c.assignees : ['Me'], frequency: c.frequency || 'daily', days: Array.isArray(c.days) ? c.days : [] 
    }));
    
    let pantry;
    try {
        pantry = JSON.parse(localStorage.getItem('sl_pantry')) || {};
        if (typeof pantry !== 'object' || Array.isArray(pantry)) throw new Error();
    } catch(e) { pantry = { 'Soy Sauce': true, 'White Rice': true, 'Olive Oil': true, 'Salt': true }; }

    function generateEmptyMeals() { let m = {}; DAYS_FULL.forEach(d => m[d] = { breakfast: null, lunch: null, dinner: null }); return m; }
    let plannedMeals;
    try {
        plannedMeals = JSON.parse(localStorage.getItem('sl_meals'));
        if (!plannedMeals || typeof plannedMeals !== 'object' || !plannedMeals['Monday']) throw new Error();
    } catch(e) { plannedMeals = generateEmptyMeals(); }

    let generatedGroceries = [];
    let activeChoreFilter = 'ALL';
    let activeChoreFrequency = 'daily';

    window.onload = function() {
      try {
        startClock();
        fetchWeather();
        extractGroceries();
        renderAll();
      } catch (err) { console.error("Onload Init Error:", err); }
    };

    function saveState() {
      localStorage.setItem('sl_recipes', JSON.stringify(recipes));
      localStorage.setItem('sl_chores', JSON.stringify(chores));
      localStorage.setItem('sl_tasks', JSON.stringify(tasks));
      localStorage.setItem('sl_meals', JSON.stringify(plannedMeals));
      localStorage.setItem('sl_pantry', JSON.stringify(pantry));
      localStorage.setItem('sl_manual_groceries', JSON.stringify(manualGroceries));
      extractGroceries();
      renderAll();
    }

    function renderAll() {
      renderChores();
      renderTasks();
      renderTodayMeals();
      renderRecipeVault();
      renderTodayEvents();
      renderGroceriesTab();
      if(window.lucide) lucide.createIcons();
    }

    function startClock() {
      setInterval(() => {
        const now = new Date();
        document.getElementById('live-time').innerHTML = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('live-date').innerText = now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
      }, 1000);
    }
    
    async function fetchWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=33.6846&longitude=-117.8265&current_weather=true');
        const data = await res.json();
        const tempF = Math.round((data.current_weather.temperature * 9/5) + 32);
        document.getElementById('weather-temp').innerText = `${tempF}°F`;
      } catch (e) { document.getElementById('weather-temp').innerText = '72°F'; }
    }

    function switchTab(tab) {
      ['dashboard', 'grocery', 'recipes'].forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        const btn = document.getElementById(`nav-btn-${t}`);
        if (el && btn) {
          el.classList.toggle('hidden', t !== tab); el.classList.toggle('flex', t === tab);
          btn.className = t === tab ? "px-4 py-2.5 rounded-xl text-xs font-bold transition-all bg-emerald-600 text-white shadow-md flex items-center gap-2" : "px-4 py-2.5 rounded-xl text-xs font-bold transition-all bg-white border border-warm-border text-warm-text hover:bg-warm-subtle flex items-center gap-2";
        }
      });
    }

    function closeModals() { document.querySelectorAll('[id^="modal-"]').forEach(m => { if(m.id !== 'modal-event-details') m.classList.add('hidden'); }); }
    function closeEventDetails() { document.getElementById('modal-event-details').classList.add('hidden'); }
    
    function openSettingsModal() {
      document.getElementById('set-g-client').value = GOOGLE_CLIENT_ID;
      document.getElementById('set-g-api').value = GOOGLE_API_KEY;
      document.getElementById('set-t-api').value = TRELLO_API_KEY;
      document.getElementById('set-t-token').value = TRELLO_TOKEN;
      document.getElementById('set-t-groc-list').value = TRELLO_GROCERY_LIST_ID;
      document.getElementById('set-t-task-list').value = TRELLO_TASKS_LIST_ID;
      document.getElementById('set-ai-api').value = GEMINI_API_KEY;
      document.getElementById('modal-settings').classList.remove('hidden');
    }

    function saveSettings() {
      localStorage.setItem('cfg_g_client', document.getElementById('set-g-client').value.trim());
      localStorage.setItem('cfg_g_api', document.getElementById('set-g-api').value.trim());
      localStorage.setItem('cfg_t_api', document.getElementById('set-t-api').value.trim());
      localStorage.setItem('cfg_t_token', document.getElementById('set-t-token').value.trim());
      localStorage.setItem('cfg_t_groc_list', document.getElementById('set-t-groc-list').value.trim());
      localStorage.setItem('cfg_t_task_list', document.getElementById('set-t-task-list').value.trim());
      localStorage.setItem('cfg_ai_api', document.getElementById('set-ai-api').value.trim());
      window.location.reload();
    }

    // --- GOOGLE CALENDAR ---
    let tokenClient;
    function gapiLoaded() { gapi.load('client', async () => { if(GOOGLE_API_KEY) await gapi.client.init({ apiKey: GOOGLE_API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'] }); }); }
    function gisLoaded() { if(GOOGLE_CLIENT_ID) tokenClient = google.accounts.oauth2.initTokenClient({ client_id: GOOGLE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/calendar.readonly', callback: '' }); }

    function handleGoogleAuth() {
      if (!tokenClient) return alert("Add Google Client ID in Settings first.");
      tokenClient.callback = async (resp) => {
        if (resp.error !== undefined) throw (resp);
        document.getElementById('google-sync-text').innerText = 'Synced';
        await fetchGoogleCalendarEvents();
      };
      tokenClient.requestAccessToken({prompt: 'consent'});
    }

    async function fetchGoogleCalendarEvents() {
      try {
        const now = new Date();
        const timeMin = new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
        const timeMax = new Date(now.getFullYear(), now.getMonth() + 1, 6).toISOString();
        
        const response = await gapi.client.calendar.events.list({
          'calendarId': 'primary', 'timeMin': timeMin, 'timeMax': timeMax,
          'showDeleted': false, 'singleEvents': true, 'maxResults': 250, 'orderBy': 'startTime'
        });
        
        events = response.result.items.map(item => {
          let eventDate, timeStr = 'All Day', dateKey;
          if (item.start.date) {
            const [y, m, d] = item.start.date.split('-');
            eventDate = new Date(parseInt(y), parseInt(m) - 1, parseInt(d)); 
            dateKey = `${y}-${m}-${d}`;
          } else {
            eventDate = new Date(item.start.dateTime);
            timeStr = eventDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            dateKey = `${eventDate.getFullYear()}-${String(eventDate.getMonth()+1).padStart(2,'0')}-${String(eventDate.getDate()).padStart(2,'0')}`;
          }
          
          const guests = item.attendees ? item.attendees.map(a => a.displayName || a.email).join(', ') : 'None';
          const dayStr = eventDate.toLocaleDateString('en-US', { weekday: 'long' });
          
          return { id: item.id, day: dayStr, dateKey: dateKey, title: item.summary, time: timeStr, location: item.location || 'No location', guests: guests };
        });
        
        localStorage.setItem('sl_events', JSON.stringify(events));
        renderTodayEvents();
      } catch (err) { console.error("Calendar fetch error:", err); }
    }

    function renderTodayEvents() {
      const container = document.getElementById('today-events-container');
      if(!container) return;
      const now = new Date();
      const todayDateKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      const todayEvents = events.filter(e => e.dateKey === todayDateKey);
      
      container.innerHTML = todayEvents.length ? todayEvents.map(e => `
        <div class="p-3 rounded-xl bg-white border border-warm-border shadow-xs cursor-pointer hover:border-blue-400" onclick="showEventDetails('${e.id}')">
          <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-200">${e.time}</span>
          <h4 class="text-sm font-bold mt-2 truncate text-warm-text">${e.title}</h4>
        </div>`).join('') : `<p class="text-xs text-warm-muted p-2">No events scheduled.</p>`;
    }
    
    function openCalendarModal() {
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const now = new Date();
      const curYear = now.getFullYear();
      const curMonth = now.getMonth();
      const firstDay = new Date(curYear, curMonth, 1).getDay(); 
      const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();

      let gridHtml = `<div class="grid grid-cols-7 gap-1 h-full min-h-[500px]">`;
      gridHtml += `<div class="col-span-7 text-center font-display font-bold text-2xl mb-4 text-warm-text">${monthNames[curMonth]} ${curYear}</div>`;
      ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => gridHtml += `<div class="text-center text-xs font-bold text-warm-muted mb-2 uppercase">${d}</div>`);
      
      for(let i=0; i<firstDay; i++) { gridHtml += `<div class="p-1"></div>`; }

      for(let d=1; d<=daysInMonth; d++) {
          const dateKey = `${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const isToday = (d === now.getDate() && curMonth === now.getMonth() && curYear === now.getFullYear());
          const bgClass = isToday ? 'bg-blue-50 border-blue-300' : 'bg-warm-subtle border-warm-border';
          const dayEvents = events.filter(e => e.dateKey === dateKey);
          
          let eventsHtml = dayEvents.map(e => `
            <div class="text-[9px] bg-white border border-blue-100 rounded px-1 py-0.5 mb-1 truncate cursor-pointer hover:border-blue-400" onclick="showEventDetails('${e.id}')">
              <span class="font-bold text-blue-600">${e.time === 'All Day' ? '' : e.time}</span> ${e.title}
            </div>`).join('');

          gridHtml += `<div class="p-1.5 border rounded-xl ${bgClass} flex flex-col overflow-hidden min-h-[90px]"><span class="text-xs font-bold ${isToday ? 'text-blue-600' : 'text-warm-muted'} mb-1">${d}</span><div class="flex-1 overflow-y-auto space-y-0.5">${eventsHtml}</div></div>`;
      }
      gridHtml += `</div>`;
      document.getElementById('full-calendar-container').innerHTML = gridHtml;
      document.getElementById('modal-calendar').classList.remove('hidden');
    }

    function showEventDetails(eventId) {
      const e = events.find(x => x.id === eventId);
      if(!e) return;
      document.getElementById('detail-title').innerText = e.title || 'Untitled';
      document.getElementById('detail-time').innerText = e.time || '';
      document.getElementById('detail-loc').innerText = e.location || 'None';
      document.getElementById('detail-guests').innerText = e.guests || 'None';
      document.getElementById('modal-event-details').classList.remove('hidden');
    }

    // --- CHORES ---
    function setChoreFrequency(freq) { activeChoreFrequency = freq; renderChores(); }
    function setChoreFilter(filter) { activeChoreFilter = filter; renderChores(); }

    function renderChores() {
      const container = document.getElementById('chores-main-container');
      if(!container) return; container.innerHTML = '';
      
      ['daily', 'weekly'].forEach(f => {
        const el = document.getElementById(`freq-btn-${f}`);
        if(el) el.className = f === activeChoreFrequency ? "bg-white shadow-sm text-warm-text px-3 py-1 rounded-lg text-xs font-bold transition-all" : "text-warm-muted hover:text-warm-text px-3 py-1 rounded-lg text-xs font-bold transition-all";
      });
      ['ALL', 'Me', 'Ryan'].forEach(a => {
        const el = document.getElementById(`filter-btn-${a}`);
        if(el) el.className = a === activeChoreFilter ? "px-3 py-1 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow-xs" : "px-3 py-1 rounded-xl text-xs font-bold border border-warm-border bg-white text-warm-muted";
      });

      let filtered = chores.filter(c => {
        if (activeChoreFrequency === 'daily') return c.frequency === 'daily' || (c.frequency === 'weekly' && c.days && c.days.includes(todayFullName));
        return c.frequency === 'weekly';
      });
      
      if (activeChoreFilter !== 'ALL') filtered = filtered.filter(c => c.assignees && c.assignees.includes(activeChoreFilter));
      filtered.sort((a, b) => (a.done === b.done) ? 0 : a.done ? 1 : -1);

      if (filtered.length === 0) { container.innerHTML = `<p class="text-xs text-warm-muted p-2 text-center">No chores match this view.</p>`; return; }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `p-3 rounded-2xl bg-white border border-warm-border flex justify-between items-center ${item.done ? 'opacity-50' : 'shadow-xs'}`;
        card.innerHTML = `
          <label class="flex items-center gap-3 flex-1 cursor-pointer">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleChore('${item.id}')" class="w-5 h-5 rounded text-emerald-600 focus:ring-0">
            <span class="text-sm font-bold ${item.done ? 'line-through text-warm-muted' : 'text-warm-text'}">${item.text}</span>
          </label>
          <div class="flex items-center gap-1.5 shrink-0">
            ${(item.assignees||[]).map(a => `<span class="text-[10px] font-bold px-2 py-1 rounded-lg border ${a==='Ryan'?'bg-blue-50 text-blue-700':'bg-emerald-50 text-emerald-700'}">${a}</span>`).join('')}
          </div>
        `;
        container.appendChild(card);
      });
    }
    
    function toggleChore(id) { const item = chores.find(c => c.id === id); if (item) { item.done = !item.done; saveState(); } }
    function resetChores() { chores.forEach(c => c.done = false); saveState(); }
    function openAddChoreModal() { document.getElementById('modal-add-chore').classList.remove('hidden'); }
    function saveChore() {
      const text = document.getElementById('input-chore-title').value.trim();
      const freq = document.getElementById('input-chore-frequency').value;
      const day = document.getElementById('input-chore-days').value;
      const assignees = [];
      if(document.getElementById('input-chore-me').checked) assignees.push('Me');
      if(document.getElementById('input-chore-ryan').checked) assignees.push('Ryan');
      if(!text) return;
      chores.push({ id: 'c'+Date.now(), text, assignees, frequency: freq, days: freq === 'weekly' ? [day] : [], done: false });
      document.getElementById('input-chore-title').value = '';
      saveState(); closeModals();
    }

    // --- TASKS ---
    function renderTasks() {
      const container = document.getElementById('tasks-main-container');
      if(!container) return; container.innerHTML = '';
      if (tasks.length === 0) { container.innerHTML = `<p class="text-xs text-warm-muted p-2 text-center">No active tasks.</p>`; return; }
      
      tasks.forEach(item => {
        const card = document.createElement('div');
        card.className = `p-3 rounded-2xl bg-white border border-warm-border flex justify-between items-center ${item.done ? 'opacity-50' : 'shadow-xs'}`;
        card.innerHTML = `
          <label class="flex items-center gap-3 flex-1 cursor-pointer">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleTask('${item.id}')" class="w-5 h-5 rounded text-purple-600 focus:ring-0">
            <span class="text-sm font-bold ${item.done ? 'line-through text-warm-muted' : 'text-warm-text'}">${item.text}</span>
          </label>
          ${item.assignee && item.assignee !== 'Unassigned' ? `<span class="text-[10px] font-bold px-2 py-1 rounded-lg border bg-purple-50 text-purple-700">${item.assignee}</span>` : ''}
          <button onclick="deleteTask('${item.id}')" class="ml-2 text-warm-muted hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        `;
        container.appendChild(card);
      });
      if(window.lucide) lucide.createIcons();
    }

    function toggleTask(id) { const t = tasks.find(x => x.id === id); if(t) { t.done = !t.done; saveState(); } }
    function deleteTask(id) { tasks = tasks.filter(x => x.id !== id); saveState(); }
    function openAddTaskModal() { document.getElementById('modal-add-task').classList.remove('hidden'); }
    function saveTask() {
      const text = document.getElementById('input-task-title').value.trim();
      const assignee = document.getElementById('input-task-assignee').value;
      if(!text) return;
      tasks.push({ id: 't'+Date.now(), text, assignee, done: false });
      document.getElementById('input-task-title').value = '';
      saveState(); closeModals();
    }
    
    async function syncTasksToTrello() {
      const btn = document.getElementById('trello-tasks-sync-btn');
      if (!TRELLO_API_KEY || !TRELLO_TOKEN || !TRELLO_TASKS_LIST_ID) return alert("Configure Trello Task List ID in Settings first.");
      btn.innerHTML = `<i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i>`;
      
      const uncompleted = tasks.filter(t => !t.done);
      try {
        for (const t of uncompleted) {
          const cardName = t.assignee && t.assignee !== 'Unassigned' ? `[${t.assignee}] ${t.text}` : t.text;
          await fetch(`https://api.trello.com/1/cards?idList=${TRELLO_TASKS_LIST_ID}&key=${TRELLO_API_KEY}&token=${TRELLO_TOKEN}&name=${encodeURIComponent(cardName)}`, { method: 'POST' });
        }
        btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i>`;
        setTimeout(() => { btn.innerHTML = `<i data-lucide="trello" class="w-3.5 h-3.5"></i> Sync`; if(window.lucide) lucide.createIcons(); }, 2000);
      } catch(err) {
        alert("Failed to sync Tasks. Check your Task List ID.");
        btn.innerHTML = `<i data-lucide="trello" class="w-3.5 h-3.5"></i> Sync`;
      }
    }

    // --- MEALS & PLANNER ---
    function renderTodayMeals() {
      const container = document.getElementById('today-meal-slots');
      if(!container) return; container.innerHTML = '';
      SLOTS.forEach(slot => {
        const mealData = plannedMeals[todayFullName] ? plannedMeals[todayFullName][slot] : null;
        const rec = mealData ? recipes.find(r => r.id === mealData.recipeId) : null;
        container.innerHTML += `
          <div class="flex items-center justify-between p-3 rounded-xl bg-white border border-amber-200 shadow-sm cursor-pointer hover:border-amber-400" 
               ${rec ? `onclick="openCookMode('${rec.id}')"` : `onclick="openMealPlannerModal()"`}>
            <div class="flex flex-col"><span class="text-[9px] uppercase font-bold text-amber-600">${slot}</span><span class="text-sm font-bold text-warm-text">${rec ? rec.title : '<span class="text-warm-muted italic font-normal">Unplanned</span>'}</span></div>
            <i data-lucide="${rec ? 'chef-hat' : 'plus'}" class="w-4 h-4 text-amber-500"></i>
          </div>
        `;
      });
    }

    function openMealPlannerModal() { renderMealPlannerGrid(); renderMealPlannerVault(); document.getElementById('modal-meal-planner').classList.remove('hidden'); }
    function renderMealPlannerGrid() {
      document.getElementById('meal-planner-grid').innerHTML = DAYS_FULL.map(day => `
        <div class="mb-4 bg-white border border-warm-border rounded-2xl p-3">
          <h4 class="font-bold text-sm uppercase text-warm-text mb-2">${day}</h4>
          <div class="grid grid-cols-3 gap-3">
            ${SLOTS.map(slot => {
              const mealData = plannedMeals[day] ? plannedMeals[day][slot] : null;
              const rec = mealData ? recipes.find(r => r.id === mealData.recipeId) : null;
              return `
                <div class="border-2 border-dashed border-warm-border rounded-xl p-2 min-h-[70px] flex flex-col justify-center items-center bg-warm-subtle/50"
                     ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDropMeal(event, '${day}', '${slot}')">
                  <span class="text-[9px] font-bold uppercase text-warm-muted">${slot}</span>
                  ${rec ? `<div class="draggable-item bg-amber-50 text-amber-900 border border-amber-200 rounded p-1 text-xs w-full mt-1 text-center font-semibold" draggable="true" ondragstart="onDragMealSlotStart(event, '${day}', '${slot}', '${rec.id}')">${rec.title}</div>` : `<span class="text-[10px] italic text-warm-muted/50 mt-1">Drop</span>`}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderMealPlannerVault() {
      document.getElementById('meal-planner-vault').innerHTML = recipes.map(r => `
        <div class="draggable-item p-3 rounded-xl bg-white border border-warm-border shadow-sm cursor-grab mb-2 hover:border-amber-300" draggable="true" ondragstart="onDragRecipeStart(event, '${r.id}')"><div class="font-bold text-sm text-warm-text">${r.title}</div></div>
      `).join('');
    }

    function onDragRecipeStart(e, id) { e.dataTransfer.setData('json', JSON.stringify({ action: 'copy', recipeId: id })); }
    function onDragMealSlotStart(e, day, slot, id) { e.dataTransfer.setData('json', JSON.stringify({ action: 'move', fromDay: day, fromSlot: slot, recipeId: id })); }
    function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over-active'); }
    function onDragLeave(e) { e.currentTarget.classList.remove('drag-over-active'); }
    function onDropMeal(e, day, slot) {
      e.preventDefault(); e.currentTarget.classList.remove('drag-over-active');
      const payload = JSON.parse(e.dataTransfer.getData('json'));
      if (payload.action === 'move') plannedMeals[payload.fromDay][payload.fromSlot] = null;
      if (!plannedMeals[day]) plannedMeals[day] = { breakfast: null, lunch: null, dinner: null }; 
      plannedMeals[day][slot] = { recipeId: payload.recipeId, cook: 'Me' };
      saveState(); renderMealPlannerGrid();
    }

    // --- GROCERIES ---
    function getCategory(name) {
      const n = name.toLowerCase();
      if (n.includes('chicken') || n.includes('beef') || n.includes('pork') || n.includes('tofu') || n.includes('steak')) return 'Meat & Proteins';
      if (n.includes('onion') || n.includes('garlic') || n.includes('spinach') || n.includes('broccoli')) return 'Produce';
      if (n.includes('milk') || n.includes('cheese') || n.includes('butter')) return 'Dairy';
      return 'Pantry / General';
    }

    function extractGroceries() {
      let extracted = {};
      DAYS_FULL.forEach(day => {
        if (!plannedMeals[day]) return;
        SLOTS.forEach(slot => {
          const mealData = plannedMeals[day][slot];
          if(mealData) {
            const recipe = recipes.find(r => r.id === mealData.recipeId);
            if(recipe && recipe.ingredients) {
              recipe.ingredients.forEach(ing => {
                if (pantry[ing.name] === true) return; 
                if(!extracted[ing.name]) extracted[ing.name] = { name: ing.name, amounts: [], category: getCategory(ing.name), checked: false };
                extracted[ing.name].amounts.push(`${ing.amount} ${ing.unit}`);
              });
            }
          }
        });
      });
      generatedGroceries = Object.values(extracted);
    }

    function renderGroceriesTab() {
      const pCont = document.getElementById('pantry-staples-container');
      if(pCont) pCont.innerHTML = Object.keys(pantry).map(item => `<label class="flex items-center gap-3 p-2 bg-white rounded-xl border border-warm-border cursor-pointer hover:border-emerald-300"><input type="checkbox" ${pantry[item] ? 'checked' : ''} onchange="togglePantry('${item}')" class="w-4 h-4 rounded text-emerald-600 focus:ring-0"><span class="text-xs font-bold text-warm-text">${item}</span></label>`).join('');

      const gCont = document.getElementById('grocery-categories-container');
      if(!gCont) return; gCont.innerHTML = '';
      let cats = {};
      generatedGroceries.forEach(g => { if(!cats[g.category]) cats[g.category] = []; cats[g.category].push(g); });
      if(manualGroceries.length > 0) { cats['Manual Additions'] = manualGroceries.map(m => ({ name: m.text, amounts: ['Custom'], manualId: m.id, checked: m.checked })); }

      if(Object.keys(cats).length === 0) return gCont.innerHTML = `<p class="text-sm text-warm-muted col-span-2">Plan meals to automatically generate grocery lists here.</p>`;

      Object.keys(cats).sort().forEach(c => {
        const itemsHtml = cats[c].map(item => `
          <div class="flex justify-between items-center py-2 border-b border-warm-subtle last:border-0">
            <div class="flex items-center gap-3">
              <input type="checkbox" class="w-4 h-4 rounded text-amber-600" ${item.checked ? 'checked' : ''} onchange="${item.manualId ? `toggleManualGrocery('${item.manualId}')` : `toggleAutoGrocery('${item.name}')`}">
              <span class="text-xs font-semibold ${item.checked ? 'line-through text-warm-muted' : 'text-warm-text'}">${item.name}</span>
            </div>
            <span class="text-[10px] font-bold text-warm-muted bg-warm-subtle px-1.5 py-0.5 rounded">${item.amounts.join(' + ')}</span>
          </div>
        `).join('');
        gCont.innerHTML += `<div class="bg-white border rounded-2xl p-4 h-max shadow-xs"><h4 class="font-bold text-xs uppercase text-amber-700 mb-2">${c}</h4>${itemsHtml}</div>`;
      });
    }

    function togglePantry(item) { pantry[item] = !pantry[item]; saveState(); }
    function toggleAutoGrocery(name) { const g = generatedGroceries.find(x => x.name === name); if(g) { g.checked = !g.checked; renderGroceriesTab(); } }
    function addManualGrocery() {
      const val = document.getElementById('manual-grocery-input').value.trim();
      if(val) { manualGroceries.push({ id: 'm'+Date.now(), text: val, checked: false }); document.getElementById('manual-grocery-input').value = ''; saveState(); }
    }
    function toggleManualGrocery(id) { const it = manualGroceries.find(m => m.id === id); if(it) { it.checked = !it.checked; saveState(); } }

    async function syncGroceriesToTrello() {
      const btn = document.getElementById('trello-grocery-sync-btn');
      if (!TRELLO_API_KEY || !TRELLO_TOKEN || !TRELLO_GROCERY_LIST_ID) return alert("Configure Trello Grocery List ID in Settings first.");
      btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i>`;
      
      let itemsToPush = [];
      generatedGroceries.forEach(g => { if(!g.checked) itemsToPush.push(`[${g.category}] ${g.name} (${g.amounts.join(' + ')})`); });
      manualGroceries.forEach(m => { if(!m.checked) itemsToPush.push(`[Custom] ${m.text}`); });
      
      try {
        for (const itemName of itemsToPush) {
          await fetch(`https://api.trello.com/1/cards?idList=${TRELLO_GROCERY_LIST_ID}&key=${TRELLO_API_KEY}&token=${TRELLO_TOKEN}&name=${encodeURIComponent(itemName)}`, { method: 'POST' });
        }
        btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i>`;
        setTimeout(() => { btn.innerHTML = `<i data-lucide="trello" class="w-4 h-4"></i> Push to Trello`; if(window.lucide) lucide.createIcons(); }, 2000);
      } catch(err) {
        alert("Failed to sync Groceries.");
        btn.innerHTML = `<i data-lucide="trello" class="w-4 h-4"></i> Push to Trello`;
      }
    }

    // --- RECIPE VAULT & AI ---
    function renderRecipeVault() {
      const grid = document.getElementById('recipe-vault-grid');
      if(!grid) return;
      grid.innerHTML = recipes.map(r => `
        <div class="warm-card rounded-2xl p-4 flex flex-col cursor-pointer hover:border-amber-400" onclick="openCookMode('${r.id}')">
          <div class="w-10 h-10 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mb-3"><i data-lucide="chef-hat" class="w-5 h-5"></i></div>
          <h3 class="font-bold text-warm-text text-base leading-tight">${r.title}</h3>
        </div>
      `).join('');
    }

    function openCookMode(recipeId) {
      const r = recipes.find(x => x.id === recipeId);
      if(!r) return;
      document.getElementById('cook-title').innerText = r.title;
      document.getElementById('cook-ingredients').innerHTML = (r.ingredients||[]).map(i => `<li><b>${i.amount} ${i.unit}</b> ${i.name}</li>`).join('');
      document.getElementById('cook-instructions').innerHTML = (r.instructions||[]).map(i => `<li>${i}</li>`).join('');
      document.getElementById('modal-cook-mode').classList.remove('hidden');
    }

    function saveRecipe() {
      const title = document.getElementById('input-recipe-title').value.trim();
      const ingText = document.getElementById('input-recipe-ingredients').value.trim();
      const instText = document.getElementById('input-recipe-instructions').value.trim();
      if (!title || !ingText) return;
      
      const ingredients = ingText.split('\n').map(line => {
        const parts = line.trim().split(' ');
        return { amount: parseFloat(parts[0])||1, unit: parts.length > 1 ? parts[1] : 'pcs', name: parts.slice(2).join(' ')||line };
      });
      recipes.push({ id: 'r' + Date.now(), title, ingredients, instructions: instText.split('\n').filter(Boolean) });
      document.getElementById('input-recipe-title').value = '';
      document.getElementById('input-recipe-ingredients').value = '';
      document.getElementById('input-recipe-instructions').value = '';
      saveState(); closeModals();
    }

    async function importAiRecipe() {
      if(!GEMINI_API_KEY) return alert("Add Gemini API Key in Settings first.");
      const input = document.getElementById('ai-recipe-input').value;
      if(!input) return alert("Paste a URL or raw text first.");
      
      const btn = document.getElementById('ai-btn');
      btn.innerHTML = 'Thinking...';
      
      try {
        const prompt = `Convert the following text into this EXACT JSON structure. Do NOT include markdown formatting like \`\`\`json or \`\`\` or conversational text. Output ONLY valid JSON: {"title": "Recipe Name", "ingredients": ["1 cup flour", "2 eggs"], "instructions": ["Step 1", "Step 2"]}. Text to parse: ${input}`;
        
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        
        if(res.status === 429) { alert("Google API limit reached. Wait 60s."); btn.innerHTML = 'Import'; return; }
        if(!res.ok) throw new Error("API Error: " + res.status);

        const data = await res.json();
        let textResult = data.candidates[0].content.parts[0].text;
        
        textResult = textResult.replace(/```json/gi, '').replace(/```/gi, '').trim();
        const jsonStart = textResult.indexOf('{');
        const jsonEnd = textResult.lastIndexOf('}');
        if (jsonStart !== -1 && jsonEnd !== -1) {
            textResult = textResult.substring(jsonStart, jsonEnd + 1);
        }

        const parsed = JSON.parse(textResult);
        document.getElementById('input-recipe-title').value = parsed.title || "Imported Recipe";
        document.getElementById('input-recipe-ingredients').value = (parsed.ingredients || []).join('\n');
        document.getElementById('input-recipe-instructions').value = (parsed.instructions || []).join('\n');
        document.getElementById('ai-recipe-input').value = ''; 
        btn.innerHTML = 'Import';
      } catch(err) {
        alert("Failed to parse the recipe. If you used a URL, the site may block bots. Try pasting the raw ingredients and instructions directly.");
        console.error("AI Error:", err);
        btn.innerHTML = 'Import';
      }
    }
  </script>
</body>
