<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Command Center</title>

  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google APIs -->
  <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
  <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], display: ['Outfit', 'sans-serif'] }, colors: { warm: { bg: '#FBF9F5', card: '#FFFFFF', subtle: '#F4F0E8', border: '#E5DFD5', text: '#2C2A29', muted: '#78736D' } } } }
    }
  </script>

  <style>
    body { background-color: #FBF9F5; color: #2C2A29; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .warm-card { background: #FFFFFF; border: 1px solid #E5DFD5; box-shadow: 0 4px 20px -2px rgba(44, 42, 41, 0.04); }
    .drag-over-active { background-color: #FEF3C7 !important; border-color: #F59E0B !important; border-style: dashed !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D8D1C7; border-radius: 9999px; }
    .draggable-item { cursor: grab; } .draggable-item:active { cursor: grabbing; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans antialiased">

  <!-- ================= HEADER ================= -->
  <header class="h-20 px-8 flex items-center justify-between shrink-0 bg-white border-b border-warm-border z-10 shadow-xs">
    <div class="flex items-center gap-6">
      <div class="flex flex-col">
        <div id="live-time" class="text-3xl font-display font-bold tracking-tight text-warm-text leading-none">--:--</div>
        <div id="live-date" class="text-xs font-semibold text-warm-muted mt-1 uppercase tracking-wider">Loading...</div>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <button onclick="handleGoogleAuth()" id="google-sync-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-50 border border-blue-200 text-blue-800 text-xs font-semibold transition-all hover:bg-blue-100">
        <span id="google-dot" class="w-2 h-2 rounded-full bg-blue-400"></span>
        <i data-lucide="calendar" class="w-3.5 h-3.5 text-blue-600"></i>
        <span id="google-sync-text">Connect GCalendar</span>
      </button>
      
      <button onclick="switchTab('dashboard')" id="nav-btn-dashboard" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all bg-emerald-600 text-white shadow-md flex items-center gap-2">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
      </button>
      <button onclick="switchTab('grocery')" id="nav-btn-grocery" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all bg-white border border-warm-border text-warm-text hover:bg-warm-subtle flex items-center gap-2">
        <i data-lucide="shopping-bag" class="w-4 h-4 text-amber-600"></i> Groceries
      </button>
      <button onclick="switchTab('recipes')" id="nav-btn-recipes" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all bg-white border border-warm-border text-warm-text hover:bg-warm-subtle flex items-center gap-2">
        <i data-lucide="chef-hat" class="w-4 h-4 text-rose-500"></i> Vault
      </button>
      
      <!-- SETTINGS BUTTON -->
      <button onclick="openSettingsModal()" class="p-2.5 rounded-xl bg-warm-subtle border border-warm-border text-warm-text hover:bg-warm-border transition-all">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="flex-1 p-6 overflow-hidden relative">
    
    <!-- === DASHBOARD TAB === -->
    <div id="tab-dashboard" class="h-full flex gap-6">
      
      <!-- LEFT: Chores -->
      <section class="w-1/2 flex flex-col warm-card rounded-3xl p-6 overflow-hidden h-full">
        <div class="flex items-center justify-between pb-4 border-b border-warm-border shrink-0">
          <div class="flex items-center gap-3">
            <div class="p-3 rounded-2xl bg-emerald-100 text-emerald-800 border border-emerald-200"><i data-lucide="check-square" class="w-6 h-6"></i></div>
            <div>
              <h2 class="font-display font-bold text-xl text-warm-text">Household Chores</h2>
              <p class="text-xs text-warm-muted">Me & Ryan</p>
            </div>
          </div>
          <div class="flex gap-2">
            <button onclick="openAddChoreModal()" class="p-2 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-100"><i data-lucide="plus" class="w-4 h-4"></i></button>
            <button onclick="resetChores()" class="px-3 py-1.5 rounded-xl bg-warm-subtle text-warm-muted hover:text-emerald-700 text-xs font-bold border flex items-center gap-1.5"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset</button>
          </div>
        </div>
        <div class="flex-1 overflow-y-auto my-3 space-y-2.5 pr-2" id="chores-main-container"></div>
      </section>

      <!-- RIGHT: Schedule & Meals -->
      <section class="w-1/2 flex flex-col gap-6 overflow-hidden h-full">
        
        <!-- Schedule -->
        <div class="h-1/2 flex flex-col warm-card rounded-3xl p-5 overflow-hidden">
          <div class="flex items-center justify-between pb-3 border-b border-warm-border shrink-0">
            <div class="flex items-center gap-2.5">
              <div class="p-2.5 rounded-2xl bg-blue-50 text-blue-600 border border-blue-200"><i data-lucide="calendar" class="w-5 h-5"></i></div>
              <div><h3 class="font-display font-bold text-base text-warm-text">Today's Schedule</h3></div>
            </div>
            <button onclick="openCalendarModal()" class="px-3 py-1.5 rounded-xl bg-blue-50 text-blue-700 hover:bg-blue-100 text-xs font-bold border border-blue-200">Month View</button>
          </div>
          <div class="flex-1 overflow-y-auto my-3 space-y-2 pr-1" id="today-events-container"></div>
        </div>

        <!-- Meals -->
        <div class="h-1/2 flex flex-col warm-card rounded-3xl p-5 overflow-hidden">
          <div class="flex items-center justify-between pb-3 border-b border-warm-border shrink-0">
            <div class
