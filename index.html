<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Command Center</title>

  <!-- ========================================================== -->
  <!-- 🛑 YOUR API KEYS GO HERE -->
  <script>
    const TRELLO_API_KEY = '';
    const TRELLO_TOKEN = '';
    const TRELLO_GROCERY_LIST_ID = '';
    const TRELLO_TASKS_LIST_ID = ''; // Optional: For a separate Trello Task list
    
    const GOOGLE_CLIENT_ID = '';
    const GOOGLE_API_KEY = '';
    
    const GEMINI_API_KEY = ''; // Optional: For AI recipe imports
  </script>
  <!-- ========================================================== -->

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
  <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], display: ['Outfit', 'sans-serif'] }, colors: { warm: { bg: '#FBF9F5', card: '#FFFFFF', subtle: '#F4F0E8', border: '#E5DFD5', text: '#2C2A29', muted: '#78736D' } } } }
    }
  </script>

  <style>
    body { background-color: #FBF9F5; color: #2C2A29; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .warm-card { background: #FFFFFF; border: 1px solid #E5DFD5; box-shadow: 0 4px 20px -2px rgba(44, 42, 41, 0.04); }
    .drag-over-active { background-color: #FEF3C7 !important; border-color: #F59E0B !important; border-style: dashed !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D8D1C7; border-radius: 9999px; }
    .draggable-item { cursor: grab; } .draggable-item:active { cursor: grabbing; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans antialiased">

  <!-- HEADER -->
  <header class="h-20 px-8 flex items-center justify-between shrink-0 bg-white border-b border-warm-border z-10 shadow-xs">
    <div class="flex items-center gap-6">
      <div class="flex flex-col">
        <div id="live-time" class="text-3xl font-display font-bold tracking-tight text-warm-text leading-none">--:--</div>
        <div id="live-date" class="text-xs font-semibold text-warm-muted mt-1 uppercase tracking-wider">Loading...</div>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <button onclick="handleGoogleAuth()" id="google-sync-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-50 border border-blue-200 text-blue-800 text-xs font-semibold mr-2 transition-all">
        <span id="google-dot" class="w-2 h-2 rounded-full bg-blue-400"></span><i data-lucide="calendar" class="w-3.5 h-3.5 text-blue-600"></i><span id="google-sync-text">Connect GCalendar</span>
      </button>
      <button onclick="switchTab('dashboard')" id="nav-btn-dashboard" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all bg-emerald-600 text-white shadow-md flex items-center gap-2">Dashboard</button>
      <button onclick="switchTab('grocery')" id="nav-btn-grocery" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all bg-white border border-warm-border text-warm-text hover:bg-warm-subtle flex items-center gap-2">Groceries</button>
      <button onclick="switchTab('recipes')" id="nav-btn-recipes" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all bg-white border border-warm-border text-warm-text hover:bg-warm-subtle flex items-center gap-2">Vault</button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 p-6 overflow-hidden relative">
    
    <!-- DASHBOARD TAB -->
    <div id="tab-dashboard" class="h-full flex gap-6">
      <section class="w-1/2 flex flex-col warm-card rounded-3xl p-6 overflow-hidden h-full">
        <div class="flex flex-col gap-3 pb-4 border-b border-warm-border shrink-0">
          <h2 class="font-display font-bold text-xl text-warm-text">Household Chores</h2>
        </div>
        <div class="flex-1 overflow-y-auto my-3 space-y-2.5 pr-2" id="chores-main-container"></div>
      </section>

      <section class="w-1/2 flex flex-col gap-6 overflow-hidden h-full">
        <div class="h-1/2 flex flex-col warm-card rounded-3xl p-5 overflow-hidden">
          <div class="flex items-center justify-between pb-3 border-b border-warm-border shrink-0">
            <h3 class="font-display font-bold text-base text-warm-text">Today's Schedule</h3>
            <button onclick="openCalendarModal()" class="px-3 py-1.5 rounded-xl bg-blue-50 text-blue-700 text-xs font-bold border border-blue-200">Month View</button>
          </div>
          <div class="flex-1 overflow-y-auto my-3 space-y-2 pr-1" id="today-events-container"></div>
        </div>

        <div class="h-1/2 flex flex-col warm-card rounded-3xl p-5 overflow-hidden">
          <div class="flex items-center justify-between pb-3 border-b border-warm-border shrink-0">
            <h3 class="font-display font-bold text-base text-warm-text">Today's Meals</h3>
            <button onclick="openMealPlannerModal()" class="px-3 py-1.5 rounded-xl bg-amber-50 text-amber-800 text-xs font-bold border border-amber-200">Plan Week</button>
          </div>
          <div class="flex-1 flex flex-col justify-center my-2 gap-2" id="today-meal-slots"></div>
        </div>
      </section>
    </div>

    <!-- GROCERIES TAB -->
    <div id="tab-grocery" class="h-full hidden flex-col warm-card rounded-3xl p-6 overflow-hidden">
      <div class="flex items-center justify-between pb-5 border-b border-warm-border shrink-0">
        <h2 class="font-display font-bold text-xl text-warm-text">Smart Grocery List</h2>
        <button onclick="syncToTrello()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Push to Trello</button>
      </div>
      <div class="flex-1 overflow-y-auto py-4 grid grid-cols-2 gap-4" id="grocery-categories-container"></div>
    </div>

    <!-- RECIPE VAULT TAB -->
    <div id="tab-recipes" class="h-full hidden flex-col warm-card rounded-3xl p-6 overflow-hidden">
      <div class="flex items-center justify-between pb-5 border-b border-warm-border shrink-0">
        <h2 class="font-display font-bold text-xl text-warm-text">Recipe Vault</h2>
        <button onclick="document.getElementById('modal-add-recipe').classList.remove('hidden')" class="px-4 py-2 bg-rose-500 text-white rounded-xl text-xs font-bold">Add Recipe</button>
      </div>
      <div class="flex-1 overflow-y-auto py-4 grid grid-cols-4 gap-4" id="recipe-vault-grid"></div>
    </div>
  </main>

  <!-- MODALS -->

  <!-- ADD RECIPE MODAL (AI + MANUAL) -->
  <div id="modal-add-recipe" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white border border-warm-border rounded-3xl max-w-lg w-full p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display font-bold text-lg text-warm-text">Add Recipe</h3>
        <button onclick="closeModals()" class="text-warm-muted"><i data-lucide="x"></i></button>
      </div>
      <div class="space-y-4">
        <div><label class="block text-xs font-bold">Recipe Title</label><input type="text" id="input-recipe-title" class="w-full bg-warm-subtle border border-warm-border rounded-xl px-3 py-2 text-xs"></div>
        <div><label class="block text-xs font-bold">Ingredients (Format: Amount Unit Name)</label><textarea id="input-recipe-ingredients" rows="3" class="w-full bg-warm-subtle border rounded-xl px-3 py-2 text-xs"></textarea></div>
        <div><label class="block text-xs font-bold">Instructions</label><textarea id="input-recipe-instructions" rows="3" class="w-full bg-warm-subtle border rounded-xl px-3 py-2 text-xs"></textarea></div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeModals()" class="px-4 py-2 bg-warm-subtle rounded-xl text-xs font-bold text-warm-text">Cancel</button>
        <button onclick="saveRecipe()" class="px-4 py-2 bg-rose-500 text-white rounded-xl text-xs font-bold">Save Recipe</button>
      </div>
    </div>
  </div>

  <!-- CALENDAR MODAL -->
  <div id="modal-calendar" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-6 z-40 hidden">
    <div class="bg-white border border-warm-border rounded-3xl max-w-4xl w-full h-[80vh] p-6 flex flex-col">
      <div class="flex justify-between items-center pb-4 border-b shrink-0">
        <h3 class="font-display font-bold text-xl">Weekly Schedule</h3>
        <button onclick="closeModals()"><i data-lucide="x"></i></button>
      </div>
      <div class="flex-1 grid grid-cols-7 gap-2 my-4 overflow-y-auto" id="full-calendar-grid"></div>
    </div>
  </div>

  <!-- EVENT DETAILS MODAL (Now completely independent from closeModals) -->
  <div id="modal-event-details" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-[60] hidden">
    <div class="bg-white border border-warm-border rounded-3xl max-w-sm w-full p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display font-bold text-lg text-blue-700">Event Details</h3>
        <!-- FIX: Only calls closeEventDetails(), does NOT close calendar -->
        <button onclick="closeEventDetails()" class="text-warm-muted hover:text-rose-500"><i data-lucide="x"></i></button>
      </div>
      <div class="space-y-4">
        <div><label class="block text-xs font-bold text-warm-muted">Title</label><div id="detail-title" class="text-sm font-bold text-warm-text break-words"></div></div>
        <div><label class="block text-xs font-bold text-warm-muted">Time</label><div id="detail-time" class="text-sm text-warm-text"></div></div>
        <div><label class="block text-xs font-bold text-warm-muted">Location</label><div id="detail-loc" class="text-sm text-warm-text break-words min-w-0"></div></div>
      </div>
    </div>
  </div>

  <!-- MEAL PLANNER MODAL -->
  <div id="modal-meal-planner" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-6 z-40 hidden">
    <div class="bg-white border border-warm-border rounded-3xl max-w-5xl w-full h-[85vh] p-6 flex flex-col">
      <div class="flex justify-between items-center pb-4 border-b shrink-0">
        <h3 class="font-display font-bold text-xl">Meal Planner (Drag & Drop)</h3>
        <button onclick="closeModals()"><i data-lucide="x"></i></button>
      </div>
      <div class="flex-1 grid grid-cols-12 gap-4 mt-4 min-h-0">
        <div class="col-span-9 overflow-y-auto pr-2" id="meal-planner-grid"></div>
        <div class="col-span-3 bg-warm-subtle rounded-2xl p-4 overflow-y-auto border border-warm-border" id="meal-planner-vault"></div>
      </div>
    </div>
  </div>

  <script>
    const DAYS_FULL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const SLOTS = ['breakfast', 'lunch', 'dinner'];

    let todayDateObj = new Date();
    let todayFullName = todayDateObj.toLocaleDateString('en-US', { weekday: 'long' });
    if (!DAYS_FULL.includes(todayFullName)) todayFullName = 'Monday';

    let recipes = JSON.parse(localStorage.getItem('sl_recipes')) || [];
    let chores = JSON.parse(localStorage.getItem('sl_chores')) || [];
    let events = JSON.parse(localStorage.getItem('sl_events')) || [];
    
    function generateEmptyMeals() { let m = {}; DAYS_FULL.forEach(d => m[d] = { breakfast: null, lunch: null, dinner: null }); return m; }
    let plannedMeals = JSON.parse(localStorage.getItem('sl_meals')) || generateEmptyMeals();

    window.onload = function() {
      startClock();
      renderAll();
      lucide.createIcons();
    };

    function saveState() {
      localStorage.setItem('sl_recipes', JSON.stringify(recipes));
      localStorage.setItem('sl_meals', JSON.stringify(plannedMeals));
      renderAll();
    }

    function renderAll() {
      renderTodayMeals();
      renderRecipeVault();
      renderTodayEvents();
    }

    function startClock() {
      setInterval(() => {
        const now = new Date();
        document.getElementById('live-time').innerHTML = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('live-date').innerText = now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
      }, 1000);
    }

    // --- GOOGLE CALENDAR API ---
    let tokenClient;
    function gapiLoaded() { gapi.load('client', initializeGapiClient); }
    async function initializeGapiClient() {
      if (!GOOGLE_API_KEY) return;
      await gapi.client.init({ apiKey: GOOGLE_API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'] });
    }
    function gisLoaded() {
      if (!GOOGLE_CLIENT_ID) return;
      tokenClient = google.accounts.oauth2.initTokenClient({ client_id: GOOGLE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/calendar.readonly', callback: '' });
    }

    function handleGoogleAuth() {
      if (!tokenClient) return;
      tokenClient.callback = async (resp) => {
        if (resp.error !== undefined) throw (resp);
        document.getElementById('google-sync-text').innerText = 'Synced';
        await fetchGoogleCalendarEvents();
      };
      tokenClient.requestAccessToken({prompt: 'consent'});
    }

    async function fetchGoogleCalendarEvents() {
      try {
        // Fetch 1 week of events
        const timeMin = new Date(); timeMin.setHours(0,0,0,0);
        const timeMax = new Date(); timeMax.setDate(timeMax.getDate() + 7);

        const response = await gapi.client.calendar.events.list({
          'calendarId': 'primary', 'timeMin': timeMin.toISOString(), 'timeMax': timeMax.toISOString(),
          'showDeleted': false, 'singleEvents': true, 'maxResults': 100, 'orderBy': 'startTime'
        });
        
        const items = response.result.items;
        events = items.map(item => {
          let eventDate;
          let timeStr = 'All Day';
          
          // FIX: Handle timezone logic strictly so UTC all-day events don't get shifted to yesterday
          if (item.start.date) {
            const parts = item.start.date.split('-');
            eventDate = new Date(parts[0], parts[1] - 1, parts[2]); // Forces local midnight
          } else {
            eventDate = new Date(item.start.dateTime);
            timeStr = eventDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          }
          
          const dayStr = eventDate.toLocaleDateString('en-US', { weekday: 'long' });
          return { 
            id: item.id, 
            day: DAYS_FULL.includes(dayStr) ? dayStr : todayFullName, 
            title: item.summary, 
            time: timeStr,
            location: item.location || 'No location'
          };
        });
        
        localStorage.setItem('sl_events', JSON.stringify(events));
        renderTodayEvents();
      } catch (err) { console.error(err); }
    }

    // --- TABS & MODALS ---
    function switchTab(tab) {
      ['dashboard', 'grocery', 'recipes'].forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        if (el) el.classList.toggle('hidden', t !== tab);
        if (el) el.classList.toggle('flex', t === tab);
      });
    }
    
    // This ONLY closes main level modals, it ignores the event details popup
    function closeModals() { 
      document.querySelectorAll('[id^="modal-"]').forEach(m => {
        if(m.id !== 'modal-event-details') m.classList.add('hidden');
      }); 
    }

    // --- SCHEDULE ---
    function renderTodayEvents() {
      const container = document.getElementById('today-events-container');
      const todayEvents = events.filter(e => e.day === todayFullName);
      container.innerHTML = todayEvents.length ? todayEvents.map(e => `
        <div class="p-3 rounded-xl bg-white border border-warm-border shadow-xs cursor-pointer hover:border-blue-300" onclick="showEventDetails('${e.title.replace(/'/g, "\\'")}', '${e.time}', '${e.location.replace(/'/g, "\\'")}')">
          <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded">${e.time}</span>
          <h4 class="text-sm font-bold mt-2 truncate">${e.title}</h4>
        </div>`).join('') : `<p class="text-xs p-2">No events</p>`;
    }
    
    function openCalendarModal() {
      document.getElementById('full-calendar-grid').innerHTML = DAYS_FULL.map(day => `
        <div class="p-2 border rounded-xl bg-warm-subtle border-warm-border">
          <div class="text-xs font-bold text-center py-1 rounded mb-2">${day}</div>
          ${events.filter(e => e.day === day).map(e => `
            <div class="p-1 text-[10px] bg-white border rounded mb-1 cursor-pointer hover:border-blue-400 overflow-hidden" 
                 onclick="showEventDetails('${e.title.replace(/'/g, "\\'")}', '${e.time}', '${e.location.replace(/'/g, "\\'")}')">
              <span class="font-bold block truncate">${e.time}</span>
              <span class="truncate block">${e.title}</span>
            </div>`).join('')}
        </div>
      `).join('');
      document.getElementById('modal-calendar').classList.remove('hidden');
    }

    // FIX: Opens cleanly on top
    function showEventDetails(title, time, loc) {
      document.getElementById('detail-title').innerText = title || 'Untitled';
      document.getElementById('detail-time').innerText = time || '';
      document.getElementById('detail-loc').innerText = loc || 'None';
      document.getElementById('modal-event-details').classList.remove('hidden');
    }
    
    // FIX: Closes cleanly without destroying calendar view underneath
    function closeEventDetails() {
      document.getElementById('modal-event-details').classList.add('hidden');
    }

    // --- MEALS ---
    function renderTodayMeals() {
      const container = document.getElementById('today-meal-slots');
      container.innerHTML = '';
      SLOTS.forEach(slot => {
        const mealData = plannedMeals[todayFullName][slot];
        const rec = mealData ? recipes.find(r => r.id === mealData.recipeId) : null;
        container.innerHTML += `
          <div class="p-3 rounded-xl bg-white border border-amber-200 cursor-pointer" onclick="openMealPlannerModal()">
            <span class="text-[9px] uppercase font-bold text-amber-600">${slot}</span>
            <span class="text-sm font-bold block">${rec ? rec.title : 'Unplanned'}</span>
          </div>
        `;
      });
    }

    function openMealPlannerModal() {
      renderMealPlannerGrid(); renderMealPlannerVault();
      document.getElementById('modal-meal-planner').classList.remove('hidden');
    }

    function renderMealPlannerGrid() {
      document.getElementById('meal-planner-grid').innerHTML = DAYS_FULL.map(day => `
        <div class="mb-4 bg-white border rounded-2xl p-3">
          <h4 class="font-bold text-sm uppercase">${day}</h4>
          <div class="grid grid-cols-3 gap-3">
            ${SLOTS.map(slot => {
              const mealData = plannedMeals[day][slot];
              const rec = mealData ? recipes.find(r => r.id === mealData.recipeId) : null;
              return `
                <div class="border-2 border-dashed rounded-xl p-2 min-h-[70px] flex flex-col justify-center items-center bg-warm-subtle/30"
                     ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDropMeal(event, '${day}', '${slot}')">
                  <span class="text-[9px] font-bold uppercase">${slot}</span>
                  ${rec ? `<div class="draggable-item bg-amber-50 text-amber-900 rounded p-1 text-xs w-full mt-1" draggable="true" ondragstart="onDragMealSlotStart(event, '${day}', '${slot}', '${rec.id}')">${rec.title}</div>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderMealPlannerVault() {
      document.getElementById('meal-planner-vault').innerHTML = recipes.map(r => `
        <div class="draggable-item p-3 rounded-xl bg-white border cursor-grab mb-2" draggable="true" ondragstart="onDragRecipeStart(event, '${r.id}')">
          <div class="font-bold text-sm">${r.title}</div>
        </div>
      `).join('');
    }

    function onDragRecipeStart(e, id) { e.dataTransfer.setData('json', JSON.stringify({ action: 'copy', recipeId: id })); }
    function onDragMealSlotStart(e, day, slot, id) { e.dataTransfer.setData('json', JSON.stringify({ action: 'move', fromDay: day, fromSlot: slot, recipeId: id })); }
    function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over-active'); }
    function onDragLeave(e) { e.currentTarget.classList.remove('drag-over-active'); }
    function onDropMeal(e, day, slot) {
      e.preventDefault(); e.currentTarget.classList.remove('drag-over-active');
      const payload = JSON.parse(e.dataTransfer.getData('json'));
      if (payload.action === 'move') plannedMeals[payload.fromDay][payload.fromSlot] = null;
      plannedMeals[day][slot] = { recipeId: payload.recipeId, cook: 'Me' };
      saveState(); renderMealPlannerGrid();
    }

    function renderRecipeVault() {
      document.getElementById('recipe-vault-grid').innerHTML = recipes.map(r => `
        <div class="warm-card rounded-2xl p-4"><h3 class="font-bold text-lg">${r.title}</h3></div>
      `).join('');
    }

    function saveRecipe() {
      const title = document.getElementById('input-recipe-title').value.trim();
      if (!title) return;
      recipes.push({ id: 'r' + Date.now(), title, ingredients: [], instructions: [] });
      saveState(); closeModals();
    }
  </script>
</body>
</html>
